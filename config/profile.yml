# Agent-facing profile index. Canonical narrative lives in user/*.md

profile_version: 2

files:
  master_cv: user/master_cv.md
  career_profile: user/career_profile.md
  proof_points: user/proof_points.md
  project_inventory: user/project_inventory.md
  voice_style: user/voice_style.md

# user/master_cv.md is generated. Run `python3 -m src.profile.master_profile`
# after changing the canonical file in resume-generation-pipeline.
master_profile_sync:
  source_path: ../resume-generation-pipeline/personal/master-profile.md
  destination_path: user/master_cv.md
  ownership: generated_do_not_edit
  hash_algorithm: sha256
  stale_check: python3 -m src.profile.master_profile --check

evaluation:
  target_roles_config: config/target_roles.yml
  scoring_weights_config: config/scoring_weights.yml
  job_keywords_config: config/job_keywords.yaml

preferences:
  employment_priority: industry
  academic_postdocs: not_targeted
  industry_postdocs:
    minimum_compensation_cad: 85000
    requires_exceptional_fit: true
  experience_years_policy: Count relevant PhD and postdoctoral years generously
  locations:
    - Montreal
    - Vancouver
    - Other Canadian locations
    - Remote with Canadian hiring support
    - Remote with US employers supporting Canadian arrangements
  work_arrangements:
    - Remote
    - Hybrid
    - On-site in Montreal
  location_weighting:
    preferred: [Montreal, Vancouver]
    acceptable_with_penalty: [Toronto, Waterloo]
  production_ai_policy: Include strategic growth potential while separating near-term capability from confirmed production evidence
  domain_scope_policy:
    narrow_roles_require_domain_alignment: true
    preferred_domains: [biomedical engineering, neuroscience, healthcare, biotech]
    low_motivation_sectors: [banking, insurance]
    broad_consulting_exception: true
    consulting_positive_signals: [agentic engineering, business intelligence, cross-domain work, client-facing problem solving]
  mobility: Willing to relocate
  work_authorization: Canada
  earliest_start_date: 2026-10
  industries:
    - AI
    - healthcare
    - biotech
    - neuroscience
    - neurotechnology
    - computational biology
  min_company_fit_score: 6.0
  min_job_fit_score: 6.5
